<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clarity">
<meta name="theme-color" content="#0a0a0a">
<title>Career Clarity</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#c8f060;--accent-dim:rgba(200,240,96,0.1);--accent-text:#0a0a0a;--text:#f0f0f0;--text2:#888;--text3:#444;--red:#ff5a5a;--amber:#ffb347;--blue:#5ab4ff;--green:#5aff9a;--purple:#c084fc;--radius:14px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;}
#header{padding:52px 20px 0;flex-shrink:0;}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.app-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);font-family:'DM Mono',monospace;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none;}
#tabs{display:flex;gap:6px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
#tabs::-webkit-scrollbar{display:none;}
.tab-btn{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:none;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;}
.tab-btn.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:500;}
#scroll{flex:1;overflow-y:auto;padding:0 20px 60px;scrollbar-width:none;}
#scroll::-webkit-scrollbar{display:none;}
.section-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:'DM Mono',monospace;margin:20px 0 8px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.card-q{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:10px;line-height:1.4;}
.card-a{font-size:13px;color:var(--text);line-height:1.6;font-family:'DM Mono',monospace;}
.card-a.empty{color:var(--text3);font-style:italic;}
.edit-area{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:'DM Mono',monospace;font-size:13px;color:var(--text);resize:none;min-height:80px;outline:none;line-height:1.6;}
.edit-area:focus{border-color:var(--accent);}
.save-btn{margin-top:8px;padding:8px 16px;background:var(--accent);color:var(--accent-text);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-family:'DM Mono',monospace;margin:3px 3px 3px 0;}
.tag-gift{background:rgba(192,132,252,.15);color:var(--purple);border:1px solid rgba(192,132,252,.25);}
.tag-love{background:rgba(255,90,90,.12);color:var(--red);border:1px solid rgba(255,90,90,.25);}
.tag-skill{background:rgba(90,180,255,.12);color:var(--blue);border:1px solid rgba(90,180,255,.2);}
.tag-gap{background:rgba(255,179,71,.12);color:var(--amber);border:1px solid rgba(255,179,71,.25);}
.tag-role{background:rgba(200,240,96,.12);color:var(--accent);border:1px solid rgba(200,240,96,.2);}
.strength-center{text-align:center;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;}
.strength-title{font-size:20px;font-weight:500;color:var(--accent);margin-bottom:4px;}
.strength-sub{font-size:12px;color:var(--text2);}
.progress-bar-wrap{background:var(--surface2);border-radius:4px;height:6px;margin-top:8px;}
.progress-bar{height:6px;border-radius:4px;background:var(--accent);transition:width .4s;}
.skill-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;}
.skill-name{font-size:13px;font-weight:500;}
.skill-level{font-size:11px;font-family:'DM Mono',monospace;}
.level-dots{display:flex;gap:3px;margin-top:4px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
.dot.filled{background:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-row">
      <span class="app-title">Career Clarity</span>
      <div style="display:flex;gap:8px;">
        <a href="index.html" class="icon-btn" title="Tasks">☰</a>
        <a href="tracker.html" class="icon-btn" title="Pipeline">📋</a>
      </div>
    </div>
  </div>
  <div id="tabs"></div>
  <div id="scroll" id="scroll"></div>
</div>

<script>
const TABS_LIST = ['Strengths','Job Roles','Skills & Gaps','Journey'];
let activeTab = 'Strengths';

// ─── DATA ─────────────────────────────────────────────────────────
const DEFAULT_DATA = {
  strengths:{
    q1:{q:"What comes easily to you?",a:"Talking to people naturally, solving problems no matter the circumstances or lengths required, taking the lead."},
    q2:{q:"What came easily as a child?",a:"Talking to people, being self-reliant and independent, being obedient and smart."},
    q3:{q:"Awards, contests, public praise?",a:"Dance, leadership, sports, coding in SQL."},
    q4:{q:"When have others said 'I wish I could do that'?",a:"Dance, coding, being bold."},
    q5:{q:"Gifts from books, tests, or reflection?",a:"Very hard-working — but needs a structured path and motivation to thrive."},
  },
  gifts:["People skills","Problem-solving under pressure","Natural leader","Bold communicator","Self-reliant","Hard worker"],
  loves:["Dance","Building things","Helping people","Coding","Leading teams","Learning"],
  skills:["SQL","Python (learning)","Data Analysis","Machine Learning (learning)","LlamaIndex/RAG","Communication","Leadership"],
  gaps:[
    {name:"Python",priority:"high",plan:"30 min/day — LeetCode easy, then pandas/sklearn projects"},
    {name:"SQL advanced",priority:"high",plan:"Mode Analytics SQL tutorial + 1 practice problem/day"},
    {name:"AWS",priority:"medium",plan:"AWS Cloud Practitioner free course — 1 hr/week"},
    {name:"ML fundamentals",priority:"medium",plan:"Fast.ai course — practical, project-based"},
    {name:"System design basics",priority:"low",plan:"Read Designing Data-Intensive Applications slowly"},
  ],
  roles:[
    {title:"Data Analyst",demand:"very high",h1b:"easy",niche:"no",match:"high",note:"Core role. Your SQL + analysis = strong fit."},
    {title:"Business Systems Analyst",demand:"high",h1b:"medium",niche:"no",match:"high",note:"Like the UIUC Foundation job. Less coding, more process."},
    {title:"Data Engineer",demand:"very high",h1b:"easy",niche:"no",match:"medium",note:"Need stronger Python + SQL pipelines. 3–6 months to close gap."},
    {title:"ML Engineer",demand:"high",h1b:"easy",niche:"no",match:"medium",note:"Need ML fundamentals + Python. Your RAG project is a start."},
    {title:"AI/LLM Engineer",demand:"very high",h1b:"easy",niche:"yes",match:"medium",note:"Niche + growing fast. Your LlamaIndex/RAG project directly applies."},
    {title:"Analytics Engineer",demand:"high",h1b:"medium",niche:"yes",match:"high",note:"dbt + SQL + data modeling. Learnable in 2–3 months."},
    {title:"Product Analyst",demand:"medium",h1b:"medium",niche:"no",match:"high",note:"SQL + business sense + communication. You have all 3."},
    {title:"BI Developer",demand:"medium",h1b:"easy",niche:"no",match:"medium",note:"Tableau/Power BI + SQL. Add one BI tool to your resume."},
  ],
  journey:{
    assess:"MS from UIUC. Strong communicator and leader. SQL certified. Currently building AI/RAG projects. Hard worker who needs structure and motivation — this app is the structure.",
    explore:"Target: Data Analyst, Business Analyst, AI/ML Engineer. Location priority: Chicago → IL → Dallas → Atlanta → NYC → Remote. Open to staffing agency (W2+H1b).",
    communicate:"Resume: needs tailoring per job using AI prompt. LinkedIn: profile optimized, Open to Work on. Cover letter: use cold email template.",
    connect:"Network: Rakshith (Oracle), Nitin (Oracle), Sridhar (Salesforce), Mounica/Madhu (Merkle). Also: Akshara → agency contacts. Professors for TA/RA. Coffee chats via LinkedIn.",
    execute:"Apply only after outreach. 80% referral rule. Check H1b first. Follow-up in 5–7 days."
  }
};

let data = {};
function loadData(){ try{ const s=localStorage.getItem('jh_clarity'); if(s){ data=JSON.parse(s); return; } }catch(e){} data=JSON.parse(JSON.stringify(DEFAULT_DATA)); }
function saveData(){ try{ localStorage.setItem('jh_clarity',JSON.stringify(data)); }catch(e){} }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── RENDER TABS ──────────────────────────────────────────────────
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS_LIST.map((t,i)=>
    `<button class="tab-btn${t===activeTab?' active':''}" onclick="switchTab(${i})">${t}</button>`
  ).join('');
}
function switchTab(i){ activeTab=TABS_LIST[i]; renderTabs(); renderContent(); }

// ─── RENDER CONTENT ───────────────────────────────────────────────
function renderContent(){
  const el = document.getElementById('scroll');
  if(activeTab==='Strengths') el.innerHTML = renderStrengths();
  else if(activeTab==='Job Roles') el.innerHTML = renderRoles();
  else if(activeTab==='Skills & Gaps') el.innerHTML = renderSkills();
  else if(activeTab==='Journey') el.innerHTML = renderJourney();
}

function renderStrengths(){
  const g = (data.gifts||[]).map(x=>`<span class="tag tag-gift">${esc(x)}</span>`).join('');
  const l = (data.loves||[]).map(x=>`<span class="tag tag-love">${esc(x)}</span>`).join('');
  const s = (data.skills||[]).map(x=>`<span class="tag tag-skill">${esc(x)}</span>`).join('');
  const qs = Object.entries(data.strengths||{});
  return `
    <div class="strength-center">
      <div class="strength-title">Your Strength Zone</div>
      <div class="strength-sub">Where Gifts + Love + Skills overlap</div>
      <div style="margin-top:14px;text-align:left;">
        <div class="section-label" style="margin-top:0;">Gifts (what comes naturally)</div>
        <div>${g}</div>
        <div class="section-label">Love (what energizes you)</div>
        <div>${l}</div>
        <div class="section-label">Skills (what you can do)</div>
        <div>${s}</div>
      </div>
    </div>
    <div class="section-label">Self-reflection answers</div>
    ${qs.map(([key,item])=>`
      <div class="card">
        <div class="card-q">${esc(item.q)}</div>
        <div class="card-a${item.a?'':' empty'}" id="ans_${key}">${item.a||'Tap to add your answer...'}</div>
        <textarea class="edit-area" id="edit_${key}" style="display:none">${esc(item.a||'')}</textarea>
        <button class="save-btn" id="btn_${key}" style="display:none" onclick="saveAnswer('${key}')">Save</button>
        <button class="save-btn" style="background:none;color:var(--text3);border:1px solid var(--border);margin-top:8px;" onclick="editAnswer('${key}')">✎ edit</button>
      </div>`).join('')}`;
}

function editAnswer(key){
  document.getElementById('ans_'+key).style.display='none';
  document.getElementById('edit_'+key).style.display='block';
  document.getElementById('btn_'+key).style.display='inline-block';
  document.getElementById('edit_'+key).focus();
}
function saveAnswer(key){
  const val = document.getElementById('edit_'+key).value.trim();
  if(!data.strengths[key]) data.strengths[key]={};
  data.strengths[key].a = val;
  saveData();
  document.getElementById('ans_'+key).textContent = val||'Tap to add your answer...';
  document.getElementById('ans_'+key).style.display='block';
  document.getElementById('edit_'+key).style.display='none';
  document.getElementById('btn_'+key).style.display='none';
}

function renderRoles(){
  const demandColor={
    'very high':'var(--green)','high':'var(--accent)',
    'medium':'var(--amber)','low':'var(--text3)'
  };
  return `
    <div class="section-label" style="margin-top:4px;">Roles to apply to — sorted by fit</div>
    ${(data.roles||[]).map(r=>`
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="font-size:14px;font-weight:500;">${esc(r.title)}</div>
          <span class="tag tag-role" style="color:${demandColor[r.demand]||'var(--text2)'}">${r.demand} demand</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
          <span class="tag" style="background:rgba(90,180,255,.1);color:var(--blue);border:1px solid rgba(90,180,255,.2);">H1b: ${r.h1b}</span>
          ${r.niche==='yes'?`<span class="tag" style="background:rgba(192,132,252,.12);color:var(--purple);border:1px solid rgba(192,132,252,.2);">niche</span>`:''}
          <span class="tag" style="background:rgba(200,240,96,.1);color:var(--accent);border:1px solid rgba(200,240,96,.2);">fit: ${r.match}</span>
        </div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5;">${esc(r.note)}</div>
      </div>`).join('')}`;
}

function renderSkills(){
  const levelMap={high:5,medium:3,low:1};
  const priorityColor={high:'var(--red)',medium:'var(--amber)',low:'var(--text3)'};
  return `
    <div class="section-label" style="margin-top:4px;">Your current skills</div>
    ${(data.skills||[]).map(s=>`
      <div class="skill-row">
        <span class="skill-name">${esc(s)}</span>
        <span class="tag tag-skill">skill</span>
      </div>`).join('')}
    <div class="section-label">Gaps to close — with a plan</div>
    ${(data.gaps||[]).map(g=>`
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="font-size:14px;font-weight:500;">${esc(g.name)}</div>
          <span style="font-size:11px;font-family:'DM Mono',monospace;color:${priorityColor[g.priority]||'var(--text2)'};">${g.priority} priority</span>
        </div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5;">📌 ${esc(g.plan)}</div>
      </div>`).join('')}
    <div class="section-label">Upskilling focus (daily)</div>
    <div class="card">
      <div style="font-size:13px;line-height:1.8;color:var(--text2);">
        <div>🐍 <strong style="color:var(--text);">Python</strong> — 30 min/day. LeetCode easy → pandas → sklearn.</div>
        <div style="margin-top:8px;">🗄️ <strong style="color:var(--text);">SQL advanced</strong> — 1 problem/day on Mode Analytics or StrataScratch.</div>
        <div style="margin-top:8px;">🤖 <strong style="color:var(--text);">AI/LLM</strong> — Continue LlamaIndex RAG project. Document it for LinkedIn.</div>
        <div style="margin-top:8px;">☁️ <strong style="color:var(--text);">AWS</strong> — Cloud Practitioner free course. 1 hr/week minimum.</div>
      </div>
    </div>`;
}

function renderJourney(){
  const steps=[
    {key:'assess',num:1,label:'Assess',color:'#5aff9a',desc:'Know who you are and what you offer'},
    {key:'explore',num:2,label:'Explore',color:'var(--accent)',desc:'Know what you\'re targeting'},
    {key:'communicate',num:3,label:'Communicate',color:'var(--blue)',desc:'Build your story tools'},
    {key:'connect',num:4,label:'Connect',color:'var(--amber)',desc:'Build relationships before applying'},
    {key:'execute',num:5,label:'Execute',color:'var(--red)',desc:'Apply, interview, get offer'},
  ];
  const j = data.journey||{};
  return steps.map(s=>`
    <div class="card" style="border-left:3px solid ${s.color};">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="width:24px;height:24px;border-radius:50%;background:${s.color};color:#000;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${s.num}</div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--text);">${s.label}</div>
          <div style="font-size:11px;color:var(--text3);">${s.desc}</div>
        </div>
      </div>
      <div class="card-a" id="j_ans_${s.key}">${esc(j[s.key]||'Tap edit to fill this in.')}</div>
      <textarea class="edit-area" id="j_edit_${s.key}" style="display:none">${esc(j[s.key]||'')}</textarea>
      <button class="save-btn" id="j_btn_${s.key}" style="display:none" onclick="saveJourney('${s.key}')">Save</button>
      <button class="save-btn" style="background:none;color:var(--text3);border:1px solid var(--border);margin-top:8px;" onclick="editJourney('${s.key}')">✎ edit</button>
    </div>`).join('');
}

function editJourney(key){
  document.getElementById('j_ans_'+key).style.display='none';
  document.getElementById('j_edit_'+key).style.display='block';
  document.getElementById('j_btn_'+key).style.display='inline-block';
}
function saveJourney(key){
  const val=document.getElementById('j_edit_'+key).value.trim();
  if(!data.journey) data.journey={};
  data.journey[key]=val;
  saveData();
  document.getElementById('j_ans_'+key).textContent=val||'Tap edit to fill this in.';
  document.getElementById('j_ans_'+key).style.display='block';
  document.getElementById('j_edit_'+key).style.display='none';
  document.getElementById('j_btn_'+key).style.display='none';
}

loadData(); renderTabs(); renderContent();
</script>
</body>
</html>
